name: Build ESP32-C6 OpenThread RCP

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-rcp.yml"]
  workflow_dispatch:
    inputs:
      idf_version:
        description: ESP-IDF docker tag
        default: v5.5.5

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:${{ inputs.idf_version || 'v5.5.5' }}
    steps:
      - name: Build ot_rcp for esp32c6 (USB-Serial/JTAG)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cp -r $IDF_PATH/examples/openthread/ot_rcp "$GITHUB_WORKSPACE/ot_rcp"
          cd "$GITHUB_WORKSPACE/ot_rcp"
          cat >> sdkconfig.defaults <<'EOF'
          CONFIG_OPENTHREAD_RCP_USB_SERIAL_JTAG=y
          # CONFIG_OPENTHREAD_RCP_UART is not set
          # CONFIG_OPENTHREAD_RCP_SPI is not set
          EOF
          sed -i 's/^          //' sdkconfig.defaults
          idf.py set-target esp32c6
          idf.py build
          grep -E "OPENTHREAD_RCP_|ESP_CONSOLE" sdkconfig | tee "$GITHUB_WORKSPACE/sdkconfig-summary.txt"
          grep -q '^CONFIG_OPENTHREAD_RCP_USB_SERIAL_JTAG=y' sdkconfig || { echo "USB RCP option not applied"; exit 1; }
          idf.py merge-bin -o "$GITHUB_WORKSPACE/ot_rcp_esp32c6_usb.bin"
          echo "Flash at 0x0: esptool --chip esp32c6 write-flash 0x0 ot_rcp_esp32c6_usb.bin" > "$GITHUB_WORKSPACE/FLASH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ot_rcp_esp32c6_usb
          path: |
            ot_rcp_esp32c6_usb.bin
            sdkconfig-summary.txt
            FLASH.txt
